name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # mcp-server-12306 仅 Windows 需要（12306 工具），Linux CI 可能无对应 wheel；测试用 FakeMCP 不依赖它
          grep -v '^mcp-server-12306' requirements.txt | xargs pip install

      - name: Run tests
        run: pytest
